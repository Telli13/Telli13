<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#58c7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mycelium Forest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="top">
    <div class="row1">
      <button id="rank" class="clay">
        <img id="rankIc" alt="">
        <span class="rk"><b id="rankName">Спора</b><span class="bar"><i id="xpFill"></i><em id="lvlTxt">Ур. 1</em></span></span>
      </button>
      <div id="seasonChip" class="clay"><b></b><span class="bar"><i></i></span></div>
      <button id="btnMenu" class="clay sq" aria-label="Меню"><i></i><i></i><i></i></button>
    </div>
    <div class="row2" id="res"></div>
    <button id="quest" class="clay"><span class="qt"></span><span class="bar"><i></i></span><span class="qr"></span></button>
    <div id="bossBar" class="clay hidden"><b></b><span class="bar"><i></i></span></div>
    <div id="buffs"></div>
  </div>
  <div id="abilities"></div>
  <div id="bottom">
    <div id="types"></div>
    <div class="row3">
      <button id="btnUpg" class="clay act" style="--c:#b48bff"></button>
      <button id="btnPow" class="clay act" style="--c:#ffc531"></button>
      <button id="btnHome" class="clay sq" aria-label="К сердцу грибницы"></button>
      <button id="btnZoom" class="clay sq" aria-label="Масштаб"></button>
    </div>
  </div>
</div>

<div id="banner"><b></b><span></span></div>
<div id="toast"></div>

<div id="menu" class="screen">
  <div class="logo"><div id="logo1"></div><div id="logo2"></div></div>
  <div id="menuRank" class="clay"></div>
  <div class="mbtns">
    <button id="mPlay" class="clay mbig" style="--c:#7ed957">Играть</button>
    <button id="mPow" class="clay mb" style="--c:#ffc531"></button>
    <button id="mCol" class="clay mb" style="--c:#b48bff"></button>
    <button id="mDaily" class="clay mb" style="--c:#ff8fc7"></button>
    <button id="mSet" class="clay mb" style="--c:#8fd8ff"></button>
  </div>
</div>

<div id="panel" class="screen hidden">
  <div class="card clay">
    <div class="hd"><b id="pTitle"></b><button id="pClose" class="clay x" style="--c:#ff6b6b" aria-label="Закрыть"></button></div>
    <div id="pBody"></div>
  </div>
</div>

<div id="modal" class="screen hidden"><div class="card clay small" id="mBody"></div></div>

<script>window.AudioContext = window.AudioContext || window.webkitAudioContext;</script>
<script src="js/lib/zzfx.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
