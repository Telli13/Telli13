<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Library Desktop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shared SVG gradients used by the decor (candles, potions...). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="g-flame" cx="50%" cy="70%" r="60%">
        <stop offset="0" stop-color="#fffbe0"/>
        <stop offset=".45" stop-color="#ffd56a"/>
        <stop offset="1" stop-color="#ff8a1e"/>
      </radialGradient>
      <radialGradient id="g-halo">
        <stop offset="0" stop-color="#ffcf6e" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ff9a2a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="g-wax" x1="0" x2="1">
        <stop offset="0" stop-color="#cdb98f"/>
        <stop offset=".45" stop-color="#f6ead0"/>
        <stop offset="1" stop-color="#bba57a"/>
      </linearGradient>
      <linearGradient id="g-brass" x1="0" x2="1">
        <stop offset="0" stop-color="#7a5520"/>
        <stop offset=".5" stop-color="#e8c27a"/>
        <stop offset="1" stop-color="#7a5520"/>
      </linearGradient>
      <radialGradient id="g-potion" cx="45%" cy="40%">
        <stop offset="0" stop-color="#ffe9a0"/>
        <stop offset=".5" stop-color="#ffa53a"/>
        <stop offset="1" stop-color="#9a3d0e"/>
      </radialGradient>
      <radialGradient id="g-globe" cx="40%" cy="35%">
        <stop offset="0" stop-color="#f3dfae"/>
        <stop offset="1" stop-color="#a5783c"/>
      </radialGradient>
    </defs>
  </svg>

  <div id="app">
    <header id="top">
      <section id="favorites" class="unit fav-case" aria-label="Favorites"></section>
      <button id="exit-btn" class="exit-btn" type="button"></button>
      <div id="search" class="search-spell">
        <span class="search-ico"></span>
        <input id="search-input" type="text" autocomplete="off" spellcheck="false" aria-label="Search spell">
        <ul id="search-results" class="spell-results" hidden></ul>
      </div>
    </header>

    <main id="hall">
      <button class="nav-arrow left" type="button" aria-label="Previous bookcase"></button>
      <div id="walls"></div>
      <button class="nav-arrow right" type="button" aria-label="Next bookcase"></button>
    </main>

    <footer id="desk">
      <label class="demo">
        <span id="demo-label"></span>
        <select id="demo-select"></select>
      </label>
      <nav id="wall-nav">
        <div id="wall-dots"></div>
        <div id="wall-label"></div>
      </nav>
      <div id="hint" class="hint"></div>
    </footer>

    <div class="vignette" aria-hidden="true"></div>
  </div>

  <div id="book-layer" hidden></div>
  <div id="dialog-layer" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Order matters: each file adds one part to window.ML -->
  <script src="js/texts.js"></script>
  <script src="js/art.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/data-fake.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/library.js"></script>
  <script src="js/book.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
