<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mycelium Forest</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #120b08;
      overflow: hidden;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      color: #f5e6c8;
    }
    #game {
      position: absolute;
      display: block;
      touch-action: none;
      box-shadow: 0 0 40px rgba(0, 0, 0, .6);
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 22px;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">Грибница просыпается…</div>
  <script src="src/game.js"></script>
</body>
</html>
