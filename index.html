<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mycelium Forest</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #120b08;
      overflow: hidden;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      color: #f5e6c8;
    }
    #game {
      position: absolute;
      display: block;
      touch-action: none;
      box-shadow: 0 0 40px rgba(0, 0, 0, .6);
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 22px;
      letter-spacing: .04em;
    }
    @font-face { font-family: 'Russo One'; font-style: normal; font-weight: 400; font-display: swap;
    src: url(art/fonts/russo-one-0.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Russo One'; font-style: normal; font-weight: 400; font-display: swap;
    src: url(art/fonts/russo-one-1.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Russo One'; font-style: normal; font-weight: 400; font-display: swap;
    src: url(art/fonts/russo-one-2.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">Грибница просыпается…</div>
  <script src="src/texts.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
